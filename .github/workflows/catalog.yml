name: Validate catalog

on:
  push:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "generated/**"
      - "COCKPIT_PLUGINS.md"
      - "requirements-dev.txt"
      - ".github/workflows/catalog.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate schema and cross-record consistency
        run: python scripts/validate_catalog.py
      - name: Verify reproducible generated files
        run: python scripts/build_indexes.py --check
      - name: Run catalog regression tests
        run: python -m unittest discover -s tests -v
